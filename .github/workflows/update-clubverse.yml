name: Update ClubVerse schedule data

on:
  schedule:
    # Sundays at 1:00 PM CDT (UTC-5). The D-Town 40+ League season (Aug 23 -
    # Oct 18, 2026) runs entirely within US Daylight Time, which ends
    # Nov 1, 2026. If this workflow needs to keep running past that date,
    # change the cron below to '0 19 * * 0' for CST (UTC-6).
    - cron: "0 18 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: update-clubverse
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run ClubVerse update
        run: node scripts/update-clubverse.mjs

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- index.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "ntxn-clubverse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Auto-update schedule/results from ClubVerse [skip ci]"
          git push

      - name: Open an issue if this run failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `ClubVerse auto-update failed — ${new Date().toISOString().slice(0, 10)}`,
              body: `The scheduled ClubVerse update workflow failed and did not update the site.\n\nRun log: ${runUrl}\n\nThe schedule/results/stats currently live on the site are unchanged from before this run — nothing broke on the live site, this just means it's stale until the next successful run (or a manual re-run via Actions → "Update ClubVerse schedule data" → "Run workflow").`,
            });
